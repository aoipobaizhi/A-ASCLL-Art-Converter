<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ASCII Art Converter</title>
<style>
:root {
  --bg: #1a1a2e;
  --surface: #16213e;
  --text: #e0e0e0;
  --accent: #66aaff;
  --border: #2a2a4a;
  --hover: #1f2f4a;
  --danger: #ff6b6b;
  --radius: 8px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: var(--bg); color: var(--text);
  font-family: "Segoe UI", system-ui, sans-serif;
  min-height: 100vh; display: flex; flex-direction: column;
}

header h1 { font-size: 20px; font-weight: 600; }
header .sub { color: #999; font-size: 13px; margin-left: 8px; }

.panel-toggle {
  width: 32px; height: 32px; border-radius: 6px; border: 1px solid var(--border);
  background: var(--bg); color: var(--text); cursor: pointer; display: flex;
  align-items: center; justify-content: center; transition: 0.2s; padding: 0;
}
.panel-toggle:hover { border-color: var(--accent); color: var(--accent); }
.panel-toggle svg { transition: transform 0.3s; }

/* Collapsed state */
body.collapsed .panel { transform: translateX(-100%); }
body.collapsed main { margin-left: 0; }
body.collapsed .panel-toggle svg { transform: rotate(180deg); }

/* Drop zone */
.drop-zone {
  border: 2px dashed var(--border); border-radius: var(--radius);
  padding: 16px; text-align: center; cursor: pointer; transition: 0.2s;
  margin-bottom: 16px; color: #999; font-size: 13px;
}
.drop-zone:hover, .drop-zone.drag-over {
  border-color: var(--accent); color: var(--accent); background: rgba(102,170,255,0.05);
}
.drop-zone input { display: none; }

/* Header */
header {
  position: fixed; top: 0; left: 0; right: 0; z-index: 100;
  height: 52px; padding: 0 24px;
  border-bottom: 1px solid var(--border);
  display: flex; align-items: center; justify-content: space-between;
  background: var(--surface);
}

/* Left panel — fixed */
.panel {
  position: fixed; top: 52px; left: 0; bottom: 32px;
  width: 320px; min-width: 320px; padding: 16px;
  border-right: 1px solid var(--border); overflow-y: auto;
  background: var(--surface); z-index: 99;
  display: flex; flex-direction: column; gap: 8px;
  transition: transform 0.3s ease;
}

/* Main — offset for fixed header + panel */
main {
  margin-top: 52px; margin-left: 320px;
  height: calc(100vh - 52px - 32px);
  display: flex; overflow: hidden;
  transition: margin-left 0.3s ease;
}

/* Controls */
.control-group { margin-bottom: 4px; }
.control-group label {
  display: flex; justify-content: space-between; align-items: center;
  font-size: 12px; color: #aaa; margin-bottom: 4px; font-weight: 500;
}
.control-group label .value { color: var(--accent); font-weight: 600; }
input[type="range"] {
  width: 100%; height: 6px; -webkit-appearance: none;
  background: var(--border); border-radius: 3px; outline: none;
}
input[type="range"]::-webkit-slider-thumb {
  -webkit-appearance: none; width: 18px; height: 18px;
  border-radius: 50%; background: var(--accent); cursor: pointer;
}

select {
  width: 100%; padding: 8px 10px; border-radius: var(--radius);
  background: var(--bg); color: var(--text); border: 1px solid var(--border);
  font-size: 13px; cursor: pointer;
}

.style-grid {
  display: grid; grid-template-columns: 1fr 1fr; gap: 8px;
}
.style-btn {
  padding: 8px; border-radius: var(--radius); border: 2px solid var(--border);
  background: var(--bg); color: var(--text); cursor: pointer; font-size: 12px;
  text-align: center; transition: 0.15s;
}
.style-btn:hover { border-color: var(--accent); }
.style-btn.active { border-color: var(--accent); background: rgba(102,170,255,0.1); }

.check-row {
  display: flex; align-items: center; gap: 8px; font-size: 13px; padding: 4px 0;
}
.check-row input[type="checkbox"] { accent-color: var(--accent); width: 16px; height: 16px; }

/* Buttons */
.btn-row { display: flex; gap: 8px; margin-top: 8px; }
.btn {
  flex: 1; padding: 10px 12px; border-radius: var(--radius);
  border: none; cursor: pointer; font-size: 13px; font-weight: 600;
  transition: 0.15s; text-align: center;
}
.btn-primary { background: var(--accent); color: #111; }
.btn-primary:hover { opacity: 0.85; }
.btn-secondary { background: var(--border); color: var(--text); }
.btn-secondary:hover { background: #3a3a5a; }
.btn-danger { background: transparent; border: 1px solid var(--danger); color: var(--danger); }
.btn-danger:hover { background: rgba(255,107,107,0.1); }

/* Preview */
.preview-wrap {
  flex: 1; overflow: auto; padding: 12px;
  display: flex; align-items: flex-start; justify-content: center;
  height: 100%;
}

/* Social links */
.social-links {
  display: flex; gap: 12px; margin-top: auto; padding-top: 12px;
  border-top: 1px solid var(--border);
}
.social-links a {
  display: flex; align-items: center; justify-content: center;
  width: 40px; height: 40px; border-radius: 8px;
  background: var(--bg); border: 1px solid var(--border);
  transition: 0.15s; text-decoration: none;
}
.social-links a:hover { border-color: var(--accent); background: rgba(102,170,255,0.1); }
.social-links a svg { width: 22px; height: 22px; fill: var(--text); }
.signature { font-size: 11px; color: #666; text-align: center; padding-top: 8px; }
.preview-wrap.grab { cursor: grab; }
.preview-wrap.grabbing { cursor: grabbing; }
.preview-wrap pre {
  font-family: "Courier New", "Source Code Pro", "Consolas", "DejaVu Sans Mono", "Droid Sans Mono", "Noto Sans Mono", monospace;
  line-height: 1.0; white-space: pre; margin: 0;
  font-size: 4px; letter-spacing: 0;
}
#canvasWrap {
  margin: 0 auto; display: block;
}
#canvasWrap canvas {
  display: block;
}

/* Toast */
.toast {
  position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
  background: var(--accent); color: #111; padding: 10px 24px;
  border-radius: 20px; font-size: 13px; font-weight: 600;
  opacity: 0; transition: opacity 0.3s; pointer-events: none; z-index: 100;
}
.toast.show { opacity: 1; }

/* Tip bar */
.tip-bar {
  position: fixed; bottom: 0; left: 0; right: 0;
  background: #1a1a2e; border-top: 1px solid #333;
  padding: 8px 20px; font-size: 12px; color: #999;
  display: flex; align-items: center; gap: 8px;
  z-index: 90; min-height: 32px;
}
.tip-bar.warn { color: #e8a840; border-color: #5a4020; }
.tip-bar.error { color: #ff6b6b; border-color: #5a2020; }

/* Mobile */
@media (max-width: 768px) {
  header { position: static; height: auto; }
  .panel { position: static; width: 100%; min-width: auto; border-right: none; border-bottom: 1px solid var(--border); }
  main { margin: 0; height: auto; flex-direction: column; }
  .preview-wrap { min-height: 400px; height: auto; }
}
</style>
</head>
<body>

<header>
  <div style="display:flex;align-items:center;gap:12px">
    <button class="panel-toggle" id="panelToggle" title="收起/展开工具栏">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z"/></svg>
    </button>
    <div><h1>ASCII Art Converter<span class="sub">上传图片 → 字符画</span></h1></div>
  </div>
</header>

<main>
  <div class="panel">
    <!-- Upload -->
    <div class="drop-zone" id="dropZone">
      拖拽图片到此处 或 点击选择文件
      <input type="file" id="fileInput" accept="image/*">
    </div>

    <!-- Style selector -->
    <div class="control-group">
      <label>渲染风格</label>
      <div class="style-grid" id="styleGrid">
        <button class="style-btn active" data-style="classic">经典 ASCII</button>
        <button class="style-btn" data-style="block">方块像素 █▓▒░</button>
        <button class="style-btn" data-style="edge">线稿素描</button>
        <button class="style-btn" data-style="numeric">数字矩阵</button>
        <button class="style-btn" data-style="detail">密集细节</button>
        <button class="style-btn" data-style="minimal">极简线条</button>
      </div>
    </div>

    <!-- Width -->
    <div class="control-group">
      <label>输出宽度 <span class="value" id="widthVal">120</span></label>
      <input type="range" id="widthSlider" min="40" max="500" value="120" step="10">
    </div>

    <!-- Contrast -->
    <div class="control-group">
      <label>对比度 <span class="value" id="contrastVal">2.0</span></label>
      <input type="range" id="contrastSlider" min="0.5" max="4" value="2" step="0.1">
    </div>

    <!-- Font size -->
    <div class="control-group">
      <label>预览字体 <span class="value" id="fontVal">4px</span></label>
      <input type="range" id="fontSlider" min="0.5" max="14" value="4" step="0.5">
    </div>

    <!-- Normal (non-inverted) -->
    <div class="check-row">
      <input type="checkbox" id="normalCheck">
      <label for="normalCheck">原色（深色字符 / 浅色背景）</label>
    </div>

    <!-- Color -->
    <div class="check-row">
      <input type="checkbox" id="colorCheck">
      <label for="colorCheck">彩色模式（保留原图颜色）</label>
    </div>

    <!-- Buttons -->
    <div class="btn-row">
      <button class="btn btn-primary" id="copyBtn">复制</button>
      <button class="btn btn-secondary" id="downloadBtn">下载 .txt</button>
    </div>
    <div class="btn-row" id="colorBtns" style="display:none">
      <button class="btn btn-primary" id="copyAnsiBtn">复制 ANSI</button>
      <button class="btn btn-secondary" id="downloadAnsiBtn">下载 .ansi</button>
      <button class="btn btn-secondary" id="downloadHtmlBtn">下载 HTML</button>
    </div>
    <div class="btn-row">
      <button class="btn btn-danger" id="resetBtn">重置</button>
    </div>

    <!-- Social links + signature -->
    <div class="social-links">
      <a href="https://space.bilibili.com/3493130588391562" target="_blank" title="Bilibili">
        <img src="https://www.bilibili.com/favicon.ico" width="22" height="22" style="display:block" alt="Bilibili">
      </a>
      <a href="https://github.com/aoipobaizhi/A-ASCLL-Art-Converter" target="_blank" title="GitHub">
        <svg viewBox="0 0 24 24"><path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0024 12c0-6.63-5.37-12-12-12z"/></svg>
      </a>
    </div>
    <div class="signature">AOIPO_BAIZHI</div>
  </div>

  <!-- Preview -->
  <div class="preview-wrap" id="previewWrap">
    <pre id="preview">拖拽或选择一张图片开始</pre>
    <div id="canvasWrap" style="display:none">
      <canvas id="previewCanvas" style="image-rendering:pixelated"></canvas>
    </div>
  </div>
</main>

<div class="toast" id="toast"></div>

<div class="tip-bar" id="tipBar">
  <span id="tipIcon">💡</span>
  <span id="tipText"></span>
</div>

<script>
// ============================================================
// Rendering Engine
// ============================================================

const CHAR_SETS = {
  classic:   '@%#*+=-:. ',
  block:     '█▓▒░ ',
  numeric:   '9876543210 ',
  detail:    '$@B%8&WM#*oahkbdpqwmZO0QLCJUYXzcvunxrjft/\\|()1{}[]?-_+~<>i!lI;:,"^`\'. ',
  minimal:   '@#. ',
  edge:      '@%#*+=-:. ',
};

function convertToGrayscale(imageData) {
  const gray = new Uint8Array(imageData.width * imageData.height);
  const data = imageData.data;
  for (let i = 0, j = 0; i < data.length; i += 4, j++) {
    gray[j] = data[i] * 0.299 + data[i + 1] * 0.587 + data[i + 2] * 0.114;
  }
  return gray;
}

function extractColors(imageData) {
  const w = imageData.width, h = imageData.height;
  const colors = new Uint8Array(w * h * 3);
  const data = imageData.data;
  for (let i = 0, j = 0; i < data.length; i += 4, j += 3) {
    colors[j] = data[i];
    colors[j + 1] = data[i + 1];
    colors[j + 2] = data[i + 2];
  }
  return { colors, w, h };
}

function applyContrast(gray, factor) {
  const result = new Uint8Array(gray.length);
  for (let i = 0; i < gray.length; i++) {
    let v = (gray[i] - 128) * factor + 128;
    result[i] = Math.max(0, Math.min(255, Math.round(v)));
  }
  return result;
}

function detectEdges(gray, w, h) {
  const result = new Uint8Array(gray.length);
  for (let y = 1; y < h - 1; y++) {
    for (let x = 1; x < w - 1; x++) {
      const i = y * w + x;
      const gx = -gray[i - w - 1] - 2 * gray[i - 1] - gray[i + w - 1]
                 + gray[i - w + 1] + 2 * gray[i + 1] + gray[i + w + 1];
      const gy = -gray[i - w - 1] - 2 * gray[i - w] - gray[i - w + 1]
                 + gray[i + w - 1] + 2 * gray[i + w] + gray[i + w + 1];
      let mag = Math.sqrt(gx * gx + gy * gy);
      mag = 255 - Math.min(255, mag * 3);
      result[i] = mag;
    }
  }
  return result;
}

function processImage(image, targetWidth, style, contrast, invert, colorMode) {
  const aspect = image.height / image.width;
  const targetHeight = Math.floor(targetWidth * aspect * 0.45);
  if (targetHeight < 1) return { plain: '', width: 0, height: 0, gray: null, colors: null, chars: '' };

  const canvas = document.createElement('canvas');
  canvas.width = targetWidth;
  canvas.height = targetHeight;
  const ctx = canvas.getContext('2d');
  ctx.drawImage(image, 0, 0, targetWidth, targetHeight);

  const imageData = ctx.getImageData(0, 0, targetWidth, targetHeight);
  let gray = convertToGrayscale(imageData);

  const useColor = colorMode && style !== 'edge';

  if (style === 'edge') {
    gray = detectEdges(gray, targetWidth, targetHeight);
    contrast = Math.max(contrast, 1.5);
  }
  gray = applyContrast(gray, contrast);

  let chars = CHAR_SETS[style] || CHAR_SETS.classic;
  if (invert) {
    chars = chars.split('').reverse().join('');
  }

  // Build plain text
  const plain = renderPlain(gray, targetWidth, targetHeight, chars);

  // Build ANSI if color mode
  let ansi = null;
  let colors = null;
  let html = null;
  if (useColor) {
    const colorData = extractColors(imageData);
    colors = colorData.colors;
    ansi = renderANSI(gray, colors, targetWidth, targetHeight, chars);
    html = renderHTML(gray, colors, targetWidth, targetHeight, chars);
  }

  return { plain, ansi, html, gray, colors, width: targetWidth, height: targetHeight, chars };
}

function renderPlain(gray, w, h, chars) {
  const lines = [];
  for (let y = 0; y < h; y++) {
    let line = '';
    const offset = y * w;
    for (let x = 0; x < w; x++) {
      const p = gray[offset + x];
      line += chars[Math.min(Math.floor(p / 255 * (chars.length - 1)), chars.length - 1)];
    }
    lines.push(line);
  }
  return lines.join('\n');
}

function renderANSI(gray, colors, w, h, chars) {
  const lines = [];
  for (let y = 0; y < h; y++) {
    const offset = y * w;
    let line = '', run = '';
    let lastR = -1, lastG = -1, lastB = -1;
    for (let x = 0; x < w; x++) {
      const i = offset + x;
      const p = gray[i];
      const ch = chars[Math.min(Math.floor(p / 255 * (chars.length - 1)), chars.length - 1)];
      const ci = i * 3;
      const r = colors[ci], g = colors[ci + 1], b = colors[ci + 2];
      if (r !== lastR || g !== lastG || b !== lastB) {
        line += run;
        run = '';
        line += `\x1b[38;2;${r};${g};${b}m`;
        lastR = r; lastG = g; lastB = b;
      }
      run += ch;
    }
    line += run;
    if (lastR !== -1) line += '\x1b[0m';
    lines.push(line);
  }
  return lines.join('\n');
}

function renderHTML(gray, colors, w, h, chars) {
  let html = `<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8">
<style>
  body { background: #111; font-family: "Courier New",Consolas,monospace;
         line-height: 1.0; white-space: pre; margin: 16px; font-size: 6px; }
</style></head><body>
`;
  for (let y = 0; y < h; y++) {
    const offset = y * w;
    let run = '';
    let lastR = -1, lastG = -1, lastB = -1;
    for (let x = 0; x < w; x++) {
      const i = offset + x;
      const ci = i * 3;
      const r = colors[ci], g = colors[ci + 1], b = colors[ci + 2];
      if (r !== lastR || g !== lastG || b !== lastB) {
        if (run) html += run.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
        run = '';
        html += `<span style="color:rgb(${r},${g},${b})">`;
        lastR = r; lastG = g; lastB = b;
      }
      const p = gray[i];
      run += chars[Math.min(Math.floor(p / 255 * (chars.length - 1)), chars.length - 1)];
    }
    html += run.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;') + '</span>\n';
  }
  html += '</body></html>';
  return html;
}

// Canvas-based color rendering — character masks + ImageData

function drawToCanvas(canvas, gray, colors, width, height, chars, zoomScale) {
  const FONT = 'bold 16px "Courier New","Source Code Pro","Consolas","Droid Sans Mono","Noto Sans Mono",monospace';
  const offC = document.createElement('canvas');
  const offX = offC.getContext('2d');
  offX.font = FONT;
  // Measure actual character width on this device
  const measured = offX.measureText('@');
  const CELL_W = Math.ceil(measured.width);
  const CELL_H = Math.ceil(16 * 1.2); // line height proportional to font
  offC.width = CELL_W;
  offC.height = CELL_H;
  offX.font = FONT;
  offX.textBaseline = 'top';
  offX.fillStyle = '#fff';

  // Pre-render character pixel masks
  const charPixels = {};
  const uniqueChars = [...new Set(chars)];
  for (const ch of uniqueChars) {
    offX.clearRect(0, 0, CELL_W, CELL_H);
    offX.fillText(ch, 0, 0);
    const mask = offX.getImageData(0, 0, CELL_W, CELL_H);
    const pixels = [];
    for (let my = 0; my < CELL_H; my++) {
      for (let mx = 0; mx < CELL_W; mx++) {
        if (mask.data[(my * CELL_W + mx) * 4] > 128) {
          pixels.push(mx, my);
        }
      }
    }
    charPixels[ch] = pixels;
  }

  const cw = width * CELL_W;
  const ch = height * CELL_H;
  const ctx = canvas.getContext('2d');
  canvas.width = cw;
  canvas.height = ch;

  // Fill background
  ctx.fillStyle = '#111';
  ctx.fillRect(0, 0, cw, ch);

  // Overlay colored characters
  const imageData = ctx.getImageData(0, 0, cw, ch);
  const out = imageData.data;

  for (let y = 0; y < height; y++) {
    const rowOffset = y * width;
    for (let x = 0; x < width; x++) {
      const i = rowOffset + x;
      const ci = i * 3;
      const r = colors[ci], g = colors[ci + 1], b = colors[ci + 2];
      const p = gray[i];
      const idx = Math.min(Math.floor(p / 255 * (chars.length - 1)), chars.length - 1);
      const ch = chars[idx];
      const pixels = charPixels[ch];
      const px = x * CELL_W;
      const py = y * CELL_H;
      for (let pi = 0; pi < pixels.length; pi += 2) {
        const mx = pixels[pi];
        const my = pixels[pi + 1];
        const outI = ((py + my) * cw + (px + mx)) * 4;
        out[outI] = r;
        out[outI + 1] = g;
        out[outI + 2] = b;
        out[outI + 3] = 255;
      }
    }
  }
  ctx.putImageData(imageData, 0, 0);

  // Set CSS display size — canvas is bitmap, CSS width/height scales uniformly
  const z = zoomScale / 4;
  canvas.style.width = Math.round(cw * z) + 'px';
  canvas.style.height = Math.round(ch * z) + 'px';
}

// ============================================================
// UI State
// ============================================================
let currentImage = null;
let currentStyle = 'classic';
let timer = 0;
let lastResult = { plain: '', ansi: null, html: null, gray: null, colors: null, width: 0, height: 0, chars: '' };

const $ = (id) => document.getElementById(id);
const dropZone = $('dropZone');
const fileInput = $('fileInput');
const preview = $('preview');
const previewCanvas = $('previewCanvas');
const previewWrap = $('previewWrap');
const toast = $('toast');
const copyBtn = $('copyBtn');
const downloadBtn = $('downloadBtn');
const colorBtns = $('colorBtns');

// Panel toggle
$('panelToggle').addEventListener('click', () => {
  document.body.classList.toggle('collapsed');
  setTimeout(updateGrabCursor, 350); // after transition
});

// Auto-load default image
function loadDefaultImage() {
  const img = new Image();
  img.onload = () => {
    currentImage = img;
    refresh();
  };
  img.src = 'leimu.png';
}
loadDefaultImage();

// Upload handlers
dropZone.addEventListener('click', () => fileInput.click());
dropZone.addEventListener('dragover', (e) => { e.preventDefault(); dropZone.classList.add('drag-over'); });
dropZone.addEventListener('dragleave', () => dropZone.classList.remove('drag-over'));
dropZone.addEventListener('drop', (e) => {
  e.preventDefault();
  dropZone.classList.remove('drag-over');
  const file = e.dataTransfer.files[0];
  if (file && file.type.startsWith('image/')) loadFile(file);
});
fileInput.addEventListener('change', () => {
  const file = fileInput.files[0];
  if (file) loadFile(file);
});

function loadFile(file) {
  const reader = new FileReader();
  reader.onload = (e) => {
    const img = new Image();
    img.onload = () => {
      currentImage = img;
      refresh();
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

// Style buttons
$('styleGrid').addEventListener('click', (e) => {
  const btn = e.target.closest('.style-btn');
  if (!btn) return;
  document.querySelectorAll('.style-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  currentStyle = btn.dataset.style;
  refresh();
});

// Sliders
$('widthSlider').addEventListener('input', function() {
  $('widthVal').textContent = this.value;
  scheduleRefresh();
});
$('contrastSlider').addEventListener('input', function() {
  $('contrastVal').textContent = parseFloat(this.value).toFixed(1);
  scheduleRefresh();
});
function applyZoom(val) {
  const v = parseFloat(val).toFixed(1);
  $('fontVal').textContent = v + 'px';
  // Text mode: change font-size directly (layout-aware, no overflow)
  preview.style.fontSize = Math.max(1, parseFloat(v)) + 'px';
  // Color mode: scale canvas display size
  if ($('colorCheck').checked && lastResult.colors) {
    const z = v / 4;
    const cw = previewCanvas.width;
    const ch = previewCanvas.height;
    if (cw && ch) {
      previewCanvas.style.width = Math.round(cw * z) + 'px';
      previewCanvas.style.height = Math.round(ch * z) + 'px';
    }
  }
  setTimeout(updateGrabCursor, 50);
}
$('fontSlider').addEventListener('input', function() { applyZoom(this.value); });
$('normalCheck').addEventListener('change', refresh);
$('colorCheck').addEventListener('change', refresh);

function scheduleRefresh() {
  clearTimeout(timer);
  timer = setTimeout(refresh, 100);
}

function updateTip(width, height, colorMode) {
  const bar = $('tipBar');
  const icon = $('tipIcon');
  const text = $('tipText');
  bar.className = 'tip-bar';
  const pixels = width * height;

  if (!colorMode) {
    icon.textContent = '💡';
    text.textContent = `纯文本模式 — 输出 ${width}×${height}，流畅无压力`;
  } else if (width <= 150) {
    icon.textContent = '💡';
    text.textContent = `彩色模式 ${width}×${height} — 性能良好`;
  } else if (width <= 250) {
    bar.className = 'tip-bar warn';
    icon.textContent = '⚠️';
    text.textContent = `彩色模式 ${width}×${height}（${(pixels/1000).toFixed(0)}k 像素）— 渲染可能稍慢，建议 ≤150 宽度`;
  } else {
    bar.className = 'tip-bar error';
    icon.textContent = '🔴';
    text.textContent = `彩色模式 ${width}×${height}（${(pixels/1000).toFixed(0)}k 像素）— 分辨率过高，可能造成卡顿，建议降低宽度`;
  }
}

function refresh() {
  if (!currentImage) {
    preview.textContent = '请选择一张图片';
    preview.style.display = '';
    $('canvasWrap').style.display = 'none';
    previewCanvas.style.display = 'none';
    return;
  }
  const width = parseInt($('widthSlider').value);
  const contrast = parseFloat($('contrastSlider').value);
  const invert = !$('normalCheck').checked; // inverted by default
  const colorMode = $('colorCheck').checked;

  lastResult = processImage(currentImage, width, currentStyle, contrast, invert, colorMode);
  updateTip(lastResult.width, lastResult.height, colorMode && !!lastResult.colors);
  setTimeout(updateGrabCursor, 50); // wait for layout to settle

  if (colorMode && lastResult.colors) {
    // Color mode: draw to canvas with device-aware font metrics
    const zoom = parseFloat($('fontSlider').value);
    drawToCanvas(previewCanvas, lastResult.gray, lastResult.colors,
                 lastResult.width, lastResult.height, lastResult.chars, zoom);
    preview.style.display = 'none';
    $('canvasWrap').style.display = '';
    previewCanvas.style.display = '';
    colorBtns.style.display = 'flex';
    copyBtn.textContent = '复制纯文本';
    downloadBtn.textContent = '下载 .txt';
  } else {
    // Non-color mode: use <pre> (single DOM update, instant)
    preview.textContent = lastResult.plain || '图片太小或无法处理';
    preview.style.display = '';
    $('canvasWrap').style.display = 'none';
    previewCanvas.style.display = 'none';
    colorBtns.style.display = 'none';
    copyBtn.textContent = '复制';
    downloadBtn.textContent = '下载 .txt';
  }
}

// Copy - plain text
copyBtn.addEventListener('click', async () => {
  try {
    await navigator.clipboard.writeText(lastResult.plain);
    showToast('已复制到剪贴板');
  } catch {
    showToast('复制失败，请手动选择文本');
  }
});

// Copy - ANSI
$('copyAnsiBtn').addEventListener('click', async () => {
  if (!lastResult.ansi) return;
  try {
    await navigator.clipboard.writeText(lastResult.ansi);
    showToast('ANSI 已复制（粘贴到终端查看）');
  } catch {
    showToast('复制失败');
  }
});

// Download - plain text
downloadBtn.addEventListener('click', () => {
  const blob = new Blob([lastResult.plain], { type: 'text/plain;charset=utf-8' });
  downloadBlob(blob, 'ascii_art.txt');
  showToast('下载中...');
});

// Download - ANSI
$('downloadAnsiBtn').addEventListener('click', () => {
  if (!lastResult.ansi) return;
  const blob = new Blob([lastResult.ansi], { type: 'text/plain;charset=utf-8' });
  downloadBlob(blob, 'ascii_art.ansi');
  showToast('ANSI 已下载（可在终端 cat 查看）');
});
$('downloadHtmlBtn').addEventListener('click', () => {
  if (!lastResult.html) return;
  const blob = new Blob([lastResult.html], { type: 'text/html;charset=utf-8' });
  downloadBlob(blob, 'ascii_art.html');
  showToast('HTML 已下载（浏览器打开即可查看彩色字符画）');
});

function downloadBlob(blob, filename) {
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  a.click();
  URL.revokeObjectURL(url);
}

$('resetBtn').addEventListener('click', () => {
  $('widthSlider').value = 120;
  $('contrastSlider').value = 2;
  $('fontSlider').value = 4;
  $('normalCheck').checked = false;
  $('colorCheck').checked = false;
  $('widthVal').textContent = '120';
  $('contrastVal').textContent = '2.0';
  $('fontVal').textContent = '4px';
  colorBtns.style.display = 'none';
  preview.style.display = '';
  $('canvasWrap').style.display = 'none';
  previewCanvas.style.display = 'none';
  copyBtn.textContent = '复制';
  downloadBtn.textContent = '下载 .txt';
  document.querySelectorAll('.style-btn').forEach(b => b.classList.remove('active'));
  document.querySelector('.style-btn[data-style="classic"]').classList.add('active');
  currentStyle = 'classic';
  loadDefaultImage();
});

function showToast(msg) {
  toast.textContent = msg;
  toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), 2000);
}

// Drag-to-pan
let dragging = false, panX = 0, panY = 0;
previewWrap.addEventListener('mousedown', (e) => {
  if (e.target === previewWrap || e.target === preview || e.target === previewCanvas || e.target.closest('#canvasWrap')) {
    // Only drag if content overflows (scrollable)
    if (previewWrap.scrollWidth <= previewWrap.clientWidth && previewWrap.scrollHeight <= previewWrap.clientHeight) return;
    e.preventDefault();
    dragging = true;
    panX = e.clientX + previewWrap.scrollLeft;
    panY = e.clientY + previewWrap.scrollTop;
    previewWrap.classList.add('grabbing');
    previewWrap.classList.remove('grab');
  }
});
window.addEventListener('mousemove', (e) => {
  if (!dragging) return;
  e.preventDefault();
  previewWrap.scrollLeft = panX - e.clientX;
  previewWrap.scrollTop = panY - e.clientY;
});
window.addEventListener('mouseup', () => {
  if (dragging) {
    dragging = false;
    previewWrap.classList.remove('grabbing');
    previewWrap.classList.add('grab');
  }
});
// Show grab cursor when content overflows
const updateGrabCursor = () => {
  const overflow = previewWrap.scrollWidth > previewWrap.clientWidth || previewWrap.scrollHeight > previewWrap.clientHeight;
  previewWrap.classList.toggle('grab', overflow);
};
window.addEventListener('resize', updateGrabCursor);

// Wheel zoom on preview area
previewWrap.addEventListener('wheel', (e) => {
  e.preventDefault();
  const slider = $('fontSlider');
  const delta = -Math.sign(e.deltaY) * 0.5;
  const newVal = Math.max(0.5, Math.min(14, parseFloat(slider.value) + delta));
  slider.value = newVal;
  applyZoom(newVal);
  updateGrabCursor();
}, { passive: false });

// Pinch-to-zoom for touch devices
let lastPinchDist = 0;
previewWrap.addEventListener('touchstart', (e) => {
  if (e.touches.length === 2) {
    lastPinchDist = Math.hypot(
      e.touches[0].clientX - e.touches[1].clientX,
      e.touches[0].clientY - e.touches[1].clientY
    );
  }
}, { passive: true });
previewWrap.addEventListener('touchmove', (e) => {
  if (e.touches.length === 2 && lastPinchDist > 0) {
    const dist = Math.hypot(
      e.touches[0].clientX - e.touches[1].clientX,
      e.touches[0].clientY - e.touches[1].clientY
    );
    const delta = (dist - lastPinchDist) / 60;
    if (Math.abs(delta) > 0.1) {
      const slider = $('fontSlider');
      const newVal = Math.max(0.5, Math.min(14, parseFloat(slider.value) + delta));
      slider.value = newVal;
      applyZoom(newVal);
      lastPinchDist = dist;
    }
  }
}, { passive: true });
previewWrap.addEventListener('touchend', () => { lastPinchDist = 0; });

// Initial render
applyZoom($('fontSlider').value);
updateTip(0, 0, false);
$('tipIcon').textContent = '💡';
$('tipText').textContent = '上传图片开始 — 彩色模式建议宽度 ≤150 以获得流畅体验';
</script>

</body>
</html>
